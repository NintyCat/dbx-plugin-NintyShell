name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@main
    with:
      release-tag: ${{ github.event.release.tag_name }}
      # CGO_ENABLED=0: pure-Go static build, no glibc dependency (avoids
      # "libc.so.6: version GLIBC_2.34 not found" on older distros).
      package-command: CGO_ENABLED=0 dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.6
